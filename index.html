<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوتنامه نوزدهمین نمایشگاه صنعت ساختمان ارومیه</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8f7;--card:#fff;--tx:#17302b;--mut:#5d7771;--ac:#0f7f6e;--ac2:#e9a800;--bd:#d6e4e0;--in:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1917;--card:#16262a;--tx:#e6f1ee;--mut:#8fb0a8;--ac:#2bb59f;--ac2:#f2bd2c;--bd:#274039;--in:#1b2d2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1917;--card:#16262a;--tx:#e6f1ee;--mut:#8fb0a8;--ac:#2bb59f;--ac2:#f2bd2c;--bd:#274039;--in:#1b2d2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"BNaz","B Nazanin",Tahoma,sans-serif;font-size:18px;line-height:1.7}
.w{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center}
header img{width:104px;height:104px;border-radius:50%;box-shadow:0 4px 18px rgba(0,0,0,.25)}
h1{font-size:26px;margin:10px 0 2px;line-height:1.4}
.sub{color:var(--mut);font-size:17px;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 8px;z-index:5}
.sb{width:100%;font:inherit;font-size:20px;padding:12px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);outline:none}
.sb:focus{border-color:var(--ac)}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ch button{font:inherit;font-size:17px;padding:4px 14px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.ch button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cnt{color:var(--mut);font-size:16px;margin:6px 2px}
.li{display:grid;gap:10px}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px}
.it .n{flex:1;font-size:19px}
.tag{font-size:14px;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:0 10px;white-space:nowrap}
.go{font:inherit;font-size:17px;background:var(--ac2);color:#222;border:0;border-radius:10px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.em{text-align:center;color:var(--mut);padding:30px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;z-index:20;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
#ov.on{display:block}
.box{max-width:900px;margin:0 auto;text-align:center}
.box img{width:100%;height:auto;border-radius:10px;background:#fff;display:block}
.act{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.act button{font:inherit;font-size:19px;padding:8px 22px;border-radius:12px;border:0;cursor:pointer}
#sv{background:var(--ac2);color:#222}#cl{background:#fff;color:#222}
.tip{color:#dfe;font-size:16px;margin-top:8px}
.ld{color:#fff;padding:60px 0}
</style>
</head>

(async()=>{try{dl=await claude.use("downloads")}catch(e){dl=null}})();
const GREEN="انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه";
function draw(label){
 const c=document.createElement("canvas");c.width=base.naturalWidth;c.height=base.naturalHeight;
 const x=c.getContext("2d");x.drawImage(base,0,0);
 x.fillStyle="#fff";
 [[1090,716,706,260],[1008,736,62,104],[1806,736,62,104],[1150,530,646,56]].forEach(r=>x.fillRect(...r));
 const cp=(sx,sy,w,h,dx,dy)=>x.drawImage(base,sx,sy,w,h,dx,dy,w,h);
 for(let k=905;k<957;k+=10){cp(1070,895,5,10,1070,k);cp(1803,895,4,10,1803,k)}
 cp(1008,740,62,95,1008,766);cp(1806,740,62,95,1806,766);
 cp(1098,716,364,54,1418,767);cp(1530,763,252,53,1166,763);cp(1098,763,432,53,1347,815);
 cp(1090,815,700,55,1090,866);cp(1090,870,700,52,1090,922);
 x.direction="rtl";x.textAlign="right";x.textBaseline="middle";
 const fit=(t,max,s)=>{do{x.font=s+"px BNaz,'B Nazanin',Tahoma";if(x.measureText(t).width<=max||s<=16)break;s--}while(1)};
 fit(GREEN,672,40);x.fillStyle=x.strokeStyle="#0f7f6e";x.lineWidth=2;x.strokeText(GREEN,1775,741);x.fillText(GREEN,1775,741);
 fit(label,620,40);x.fillStyle="#464646";x.fillText(label,1777,557);
 if(stamp)x.drawImage(stamp,1335-stamp.naturalWidth,955);
 return c;
}
async function show(it){
 const ov=$("ov"),bx=$("bx");ov.classList.add("on");bx.innerHTML='<div class="ld">در حال ساخت دعوتنامه…</div>';
 await ready;
 const c=draw(T[it.k][1]+it.n);
 const url=c.toDataURL("image/jpeg",.93);
 bx.innerHTML=`<img alt="دعوتنامه ${esc(it.n)}" src="${url}"><div class="act"><button id="sv">دانلود دعوتنامه</button><button id="cl">بستن</button></div><div class="tip">اگر دانلود انجام نشد، انگشت را روی تصویر نگه دارید و ذخیره کنید.</div>`;
 $("cl").onclick=()=>ov.classList.remove("on");
 $("sv").onclick=()=>c.toBlob(async b=>{const fn="دعوتنامه "+it.n+".jpg";let ok=false;if(dl){try{await dl.save({filename:fn,data:b});ok=true}catch(e){}}if(!ok){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove()}},"image/jpeg",.95);
}
$("ov").onclick=e=>{if(e.target.id=="ov")$("ov").classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("ov").classList.remove("on")});
render();
</script>
